<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        rel="stylesheet"
        href="../../components/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="./food.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Miniver&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet"
    >

    <title>Food Details</title>

</head>


<body>

    <!-- Sidebar -->

    <div id="sidebar-container"></div>


    <div class="main">

        <!-- Navbar -->

        <div class="main-navbar">

            <ion-icon
                class="menu-toggle"
                name="menu-outline">
            </ion-icon>


            <div class="search">

                <input
                    type="text"
                    placeholder="What you want to eat?"
                >

                <button class="search-btn">
                    Search
                </button>

            </div>


            <div class="profile">

                <a
                    href="../cart/cart.html"
                    class="cart"
                >

                    <ion-icon
                        name="cart-outline">
                    </ion-icon>

                    <span
                        id="cart-count"
                        class="cart-count"
                    >
                        0
                    </span>

                </a>

                <a
                    href="#"
                    class="user"
                >
                    <ion-icon
                        name="person-outline">
                    </ion-icon>
                </a>
            </div>
        </div>

        <!-- Food detail -->

        <section class="food-detail">

            <a
                href="../../index.html"
                class="back-link"
            >

                <ion-icon
                    name="arrow-back-outline">
                </ion-icon>

                Back to menu

            </a>


            <div
                id="food-detail-container"
                class="food-detail-container"
            >

                <p>
                    Loading food...
                </p>

            </div>

        </section>


        <!-- Related foods -->

        <section class="related-foods">

            <div class="food-section-header">

                <h2>
                    You may also like
                </h2>

            </div>


            <div
                id="related-food-list"
                class="related-food-list"
            >

            </div>

        </section>

    </div>


    <!-- Ionicons -->

    <script
        type="module"
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js">
    </script>

    <script
        nomodule
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js">
    </script>


    <!-- Sidebar -->

    <script
        type="module"
        src="../../js/components/sidebar.js">
    </script>


    <!-- Food -->

    <script
        type="module"
        src="../../js/food/food.js">
    </script>

</body>

</html>
