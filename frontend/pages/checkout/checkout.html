<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        rel="stylesheet"
        href="../../components/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="./checkout.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Miniver&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet"
    >

    <title>Checkout - FoodTime</title>

</head>


<body>

    <!-- Sidebar -->

    <div id="sidebar-container"></div>


    <!-- Main -->

    <div class="main">

        <!-- Navbar -->

        <div class="main-navbar">

            <ion-icon
                class="menu-toggle"
                name="menu-outline">
            </ion-icon>


            <div class="search">

                <input
                    type="text"
                    placeholder="What you want to eat?"
                >

                <button class="search-btn">
                    Search
                </button>

            </div>


            <div class="profile">

                <a
                    href="../cart/cart.html"
                    class="cart"
                >
                    <ion-icon
                        name="cart-outline">
                    </ion-icon>
                </a>


                <a
                    href="#"
                    class="user"
                >
                    <ion-icon
                        name="person-outline">
                    </ion-icon>
                </a>

            </div>

        </div>


        <!-- Checkout -->

        <div class="checkout-page">

            <div class="checkout-header">

                <h2 class="main-title">
                    Checkout
                </h2>

                <p>
                    Complete your order
                </p>

            </div>


            <div class="checkout-content">


                <!-- =====================
                     Delivery Information
                ====================== -->

                <div class="checkout-form">

                    <div class="checkout-card">

                        <h3>
                            Delivery Information
                        </h3>


                        <div class="form-group">

                            <label for="full-name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="full-name"
                                placeholder="Enter your name"
                            >

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="Enter your phone number"
                            >

                        </div>


                        <div class="form-group">

                            <label for="address">
                                Delivery Address
                            </label>

                            <textarea
                                id="address"
                                rows="4"
                                placeholder="Enter your delivery address"
                            ></textarea>

                        </div>

                    </div>


                    <!-- Payment -->

                    <div class="checkout-card">

                        <h3>
                            Payment Method
                        </h3>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="COD"
                                checked
                            >

                            <span>

                                <strong>
                                    Cash on Delivery
                                </strong>

                                <small>
                                    Pay when your order arrives
                                </small>

                            </span>

                        </label>


                        <label class="payment-option">

                            <input
                                type="radio"
                                name="payment"
                                value="WALLET"
                            >

                            <span>

                                <strong>
                                    Wallet
                                </strong>

                                <small>
                                    Pay using your FoodTime wallet
                                </small>

                            </span>

                        </label>

                    </div>

                </div>


                <!-- =====================
                     Order Summary
                ====================== -->

                <div class="checkout-summary">

                    <h3>
                        Order Summary
                    </h3>


                    <div
                        id="checkout-items"
                        class="checkout-items"
                    >
                    </div>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <span id="checkout-subtotal">
                            $0.00
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery Fee
                        </span>

                        <span id="checkout-delivery">
                            $0.00
                        </span>

                    </div>


                    <hr>


                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <span id="checkout-total">
                            $0.00
                        </span>

                    </div>


                    <button
                        class="place-order-btn"
                        id="place-order-btn"
                    >

                        <ion-icon
                            name="checkmark-circle-outline">
                        </ion-icon>

                        Place Order

                    </button>


                    <a
                        href="../cart/cart.html"
                        class="back-cart-btn"
                    >

                        <ion-icon
                            name="arrow-back-outline">
                        </ion-icon>

                        Back to Cart

                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- Ionicons -->

    <script
        type="module"
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js">
    </script>

    <script
        nomodule
        src="https://unpkg.com/ionicons@8.0.0/dist/ionicons/ionicons.js">
    </script>


    <!-- Sidebar -->

    <script
        type="module"
        src="../../js/components/sidebar.js">
    </script>


    <!-- Checkout -->

    <script
        type="module"
        src="../../js/checkout/checkout.js">
    </script>

</body>

</html>
