<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="./bill-detail.css"
    >

    <link
        rel="stylesheet"
        href="../../components/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Miniver&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet"
    >

    <title>Order Details - FoodTime</title>

</head>

<body>

    <div id="sidebar-container"></div>

    <div class="main">

        <!-- Navbar -->

        <div class="main-navbar">

            <ion-icon
                class="menu-toggle"
                name="menu-outline">
            </ion-icon>

            <div class="search">

                <input
                    type="text"
                    placeholder="Search..."
                >

                <button class="search-btn">
                    Search
                </button>

            </div>

            <div class="profile">

                <a
                    href="../cart/cart.html"
                    class="cart"
                >

                    <ion-icon
                        name="cart-outline">
                    </ion-icon>

                    <span
                        id="cart-count"
                        class="cart-count"
                    >
                        0
                    </span>

                </a>

                <a
                    href="../profile/profile.html"
                    class="user"
                >

                    <ion-icon
                        name="person-outline">
                    </ion-icon>

                </a>

            </div>

        </div>


        <!-- Back -->

        <div class="bill-detail-back">

            <a href="./bills.html">

                <ion-icon
                    name="arrow-back-outline">
                </ion-icon>

                Back to My Bills

            </a>

        </div>


        <!-- Order Detail -->

        <div
            id="bill-detail"
            class="bill-detail"
        >

            <div class="bill-detail-loading">

                Loading order details...

            </div>

        </div>

    </div>


    <!-- Ionicons -->

    <script
        type="module"
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js">
    </script>

    <script
        nomodule
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js">
    </script>


    <!-- Sidebar -->

    <script
        type="module"
        src="../../js/components/sidebar.js">
    </script>


    <!-- Cart badge -->

    <script
        type="module"
        src="../../js/cart/cartBadge.js">
    </script>


    <!-- Bill detail -->

    <script
        type="module"
        src="../../js/bills/bill-detail.js">
    </script>

</body>

</html>
